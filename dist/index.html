<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="映像と音声、AIと一緒に編集するスライド制作環境"><title>Slide Studio</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="titlebar"><div class="brand"><span class="brand-icon">S</span> SLIDE STUDIO <span class="muted">/</span> <input id="deck-name" aria-label="プロジェクト名"></div><div class="header-actions"><span id="save-state">読み込み中</span><button data-action="palette">⌘ K</button><button data-action="export-menu">書き出し</button><button class="primary" data-action="present">▶ 発表する</button></div></header>
<div class="workspace"><nav class="activity"><button title="スライド" data-panel="slides" class="active">▤</button><button title="素材" data-panel="assets">▧</button><button title="検索" data-panel="search">⌕</button><button title="AI編集" data-panel="agent">✦</button><button title="TouchDesigner連携" data-panel="bridge">⇄</button><div class="grow"></div><button title="使い方" data-action="help">?</button></nav>
<aside id="sidebar"><div class="panel-heading"><span id="panel-title">EXPLORER</span><button data-action="add" title="スライド追加">＋</button></div><div id="sidebar-body"></div></aside><div class="splitter" data-resize="left"></div>
<main><div class="tabs"><button class="active" data-view="canvas">▧ Canvas</button><button data-view="source">{} deck.json</button><button data-view="overview">▦ Overview</button><div class="grow"></div><button data-action="undo" title="元に戻す">↶</button><button data-action="redo" title="やり直す">↷</button></div><div class="breadcrumbs" id="breadcrumbs"></div>
<div class="canvas-toolbar"><div><button data-action="previous">‹</button><span id="page-label"></span><button data-action="next">›</button></div><div><select id="zoom" aria-label="プレビュー倍率"><option value="fit">Fit</option><option value="0.75">75%</option><option value="1">100%</option></select><button data-action="media-preview">▶ 素材再生</button><button data-action="presenter">発表者画面</button></div></div>
<div id="canvas-area"><div id="stage"></div></div><div id="source-area" hidden><div class="source-toolbar"><span>AIと共有するプロジェクトデータ</span><button data-action="format-source">整形</button><button class="primary" data-action="apply-source">変更を適用</button></div><textarea id="source-editor" spellcheck="false" aria-label="プロジェクトJSON"></textarea><div id="source-error"></div></div><div id="overview-area" hidden></div>
<div class="notes"><div class="notes-heading">SPEAKER NOTES <span>発表者だけに表示</span></div><textarea id="notes" placeholder="ここで何を話すか。映像を再生するタイミングなど。" aria-label="発表者ノート"></textarea></div>
<section class="console"><div class="console-tabs"><span>OUTPUT</span><button data-action="validate">チェック</button><div class="grow"></div><button data-action="clear-log">クリア</button></div><div id="logs"></div></section>
</main><div class="splitter" data-resize="right"></div><aside id="inspector"><div class="panel-heading">INSPECTOR</div><div id="inspector-body"></div></aside></div>
<footer><span id="status-left">● Local workspace</span><span id="status-right">16:9 · JSON v1</span></footer>
<div id="toast" role="status"></div><dialog id="modal"><div id="modal-body"></div></dialog><input id="media-input" type="file" accept="image/*,video/*,audio/*" multiple hidden><input id="project-input" type="file" accept=".json,.slide,.md" hidden>
<section id="presentation" hidden><div id="presentation-stage"></div><div class="presentation-controls"><button data-action="exit-present">Esc 終了</button><button data-action="previous">‹</button><span id="presentation-page"></span><button data-action="next">›</button><button data-action="blackout">B 暗転</button><button data-action="presenter">発表者画面</button></div><div id="blackout" hidden></div></section>
<link rel="stylesheet" href="advanced.css"><script src="app.js"></script><script src="advanced.js"></script><link rel="stylesheet" href="library.css"><script src="library.js"></script></body></html>
